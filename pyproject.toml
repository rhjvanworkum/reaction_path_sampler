[project]
name = "reaction-path-sampler"
version = "0.1.0"
description = "Sample reaction paths and locate transition states from reactant/product SMILES using semi-empirical and DFT quantum-chemistry backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ruard van Workum", email = "ruard@dunia.ai" }]
keywords = [
    "computational-chemistry",
    "reaction-path",
    "transition-state",
    "conformer-sampling",
    "xtb",
    "crest",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core, pip-installable dependencies.
#
# NOTE: three runtime dependencies are NOT on PyPI and must be installed
# separately (see README "Installation"). They are treated as external
# prerequisites, exactly like the QM binaries:
#   - autode               -> conda: `conda install -c conda-forge autode`
#                             or pip: `uv pip install "autode @ git+https://github.com/duartegroup/autodE.git"`
#   - openbabel            -> conda: `conda install -c conda-forge openbabel`
#   - geodesic_interpolate -> git clone + `uv pip install .`
# In addition the following external *binaries* must be on PATH / configured:
#   - xtb, crest, orca, pysis (the pysisyphus CLI, installed by the pip dep below)
dependencies = [
    "rdkit",
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "pyyaml",
    "scikit-learn",
    "tqdm",
    "h5py",
    "timeout-decorator",
    "plotly",
    "pysisyphus",
]

[project.optional-dependencies]
# Heavy / optional quantum-chemistry backends.
qm = [
    "pyscf",
    "rxnmapper",
]
# Plotting used only by research/analysis scripts.
research = [
    "matplotlib",
]

# NOTE: console-script entry points are added in the src/-layout phase, once the
# CLI driver module (reaction_path_sampler.cli) exists.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reaction_path_sampler"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research", "notebooks"]

[tool.ruff.lint]
# Start lenient: pyflakes (F) + a sensible subset of pycodestyle/pyupgrade/isort.
# Tighten over time.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # function calls in argument defaults (common in scientific APIs)
]

[tool.mypy]
python_version = "3.11"
# Start lenient; tighten module-by-module over time.
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
exclude = ["research/", "notebooks/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external QM binaries (xtb/crest/orca/pysis); skipped unless RPS_RUN_INTEGRATION=1",
]
